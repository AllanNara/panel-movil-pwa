<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #f9fafc; color: #202124;
      font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .caja { text-align: center; padding: 24px; max-width: 320px; }
    .caja img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 16px; }
    .caja h1 { font-size: 20px; margin: 0 0 8px; }
    .caja p { font-size: 14px; color: #5f6368; margin: 0 0 24px; }
    .boton {
      display: inline-block; background: #1a73e8; color: #fff; text-decoration: none;
      font-weight: bold; font-size: 16px; padding: 14px 28px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <img src="icons/icon-192.png" alt="">
    <h1>Finanzas</h1>
    <p>Panel Móvil del Registro Financiero.</p>
    <!--
      Esta URL es la del Web App de Apps Script (deployment id fijo, ver
      CLAUDE.md del repo principal "registro_financiero" -- comando
      `clasp deploy -i <id>`). Se mantiene fija mientras ese mismo -i se
      siga reusando en cada deploy; si alguna vez se crea una implementación
      NUEVA en vez de una versión nueva de esta, esta URL queda archivada y
      hay que actualizarla acá a mano con la URL nueva.
    -->
    <a class="boton" id="abrir" href="https://script.google.com/macros/s/AKfycbwX6yzp8rVp8GeT0UWceHVNGxtAZwF39VCV5QuKxqhUklc5x2NO6gYH98Fw5NfKLFYa/exec">
      Abrir Panel Móvil
    </a>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // Navegación real (no iframe) para que la cookie de sesión de Google viaje
    // como de "primera parte" -- en un iframe de otro origen, Google no la ve
    // y el Web App (atado a un archivo de Drive) falla con un error genérico.
    // Solo se redirige sola cuando ya corre como app instalada
    // (display-mode: standalone / navigator.standalone en iOS): en una pestaña
    // normal del navegador se queda en esta pantalla, que es la que Chrome
    // necesita ver para ofrecer "Instalar aplicación".
    var esStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (esStandalone) {
      location.replace(document.getElementById('abrir').href);
    }
  </script>
</body>
</html>
